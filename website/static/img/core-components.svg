<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .subtitle { font: 16px sans-serif; fill: #34495e; }
    .component { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 10; ry: 10; }
    .component-text { font: 14px sans-serif; fill: white; text-anchor: middle; }
    .connection { stroke: #7f8c8d; stroke-width: 2; stroke-dasharray: 5,5; }
    .arrow { stroke: #e74c3c; stroke-width: 2; marker-end: url(#arrowhead); }
    .sensor { fill: #2ecc71; }
    .cognition { fill: #9b59b6; }
    .action { fill: #e67e22; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>

  <text x="450" y="30" class="title">Core Components of Physical AI Systems</text>

  <!-- Perception System -->
  <rect x="50" y="80" width="200" height="150" class="component sensor"/>
  <text x="150" y="110" class="component-text">Perception System</text>
  <text x="150" y="140" class="component-text">Sensors</text>
  <text x="150" y="160" class="component-text">Cameras, LiDAR, IMU</text>
  <text x="150" y="180" class="component-text">Sensor Fusion</text>
  <text x="150" y="200" class="component-text">State Estimation</text>

  <!-- Cognition System -->
  <rect x="350" y="80" width="200" height="150" class="component cognition"/>
  <text x="450" y="110" class="component-text">Cognition System</text>
  <text x="450" y="140" class="component-text">Planning</text>
  <text x="450" y="160" class="component-text">Learning</text>
  <text x="450" y="180" class="component-text">Reasoning</text>
  <text x="450" y="200" class="component-text">Decision Making</text>

  <!-- Action System -->
  <rect x="650" y="80" width="200" height="150" class="component action"/>
  <text x="750" y="110" class="component-text">Action System</text>
  <text x="750" y="140" class="component-text">Control</text>
  <text x="750" y="160" class="component-text">Actuation</text>
  <text x="750" y="180" class="component-text">Safety</text>
  <text x="750" y="200" class="component-text">Trajectory Generation</text>

  <!-- Environment -->
  <rect x="350" y="280" width="200" height="150" class="component" style="fill: #ecf0f1; stroke: #34495e;"/>
  <text x="450" y="310" class="component-text" style="fill: #2c3e50;">Environment</text>
  <text x="450" y="330" class="component-text" style="fill: #2c3e50;">Real World</text>
  <text x="450" y="350" class="component-text" style="fill: #2c3e50;">Physics</text>
  <text x="450" y="370" class="component-text" style="fill: #2c3e50;">Objects & Humans</text>

  <!-- Arrows showing flow -->
  <line x1="250" y1="155" x2="350" y2="155" class="arrow"/>
  <line x1="550" y1="155" x2="650" y2="155" class="arrow"/>
  <line x1="450" y1="230" x2="450" y2="280" class="arrow"/>
  <line x1="450" y1="430" x2="450" y2="480" class="arrow" style="stroke: #27ae60;"/>
  <text x="470" y="460" style="font: 12px sans-serif; fill: #27ae60;">Feedback</text>

  <!-- Bidirectional connections -->
  <line x1="150" y1="230" x2="150" y2="355" class="connection"/>
  <line x1="150" y1="355" x2="350" y2="355" class="connection"/>
  <line x1="750" y1="230" x2="750" y2="355" class="connection"/>
  <line x1="750" y1="355" x2="550" y2="355" class="connection"/>
</svg>