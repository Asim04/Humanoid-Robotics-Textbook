<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .subtitle { font: 16px sans-serif; fill: #34495e; }
    .robot-arm { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
    .sensor { fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; rx: 5; ry: 5; }
    .force-vector { stroke: #e74c3c; stroke-width: 3; marker-end: url(#arrowhead); }
    .torque-arc { stroke: #f39c12; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .object { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
    .text { font: 14px sans-serif; fill: #2c3e50; }
    .label { font: 14px sans-serif; fill: #e74c3c; font-weight: bold; }
    .connection { stroke: #7f8c8d; stroke-width: 2; stroke-dasharray: 4,2; }
  </style>

  <text x="450" y="30" class="title">Force/Torque Sensor Concept</text>

  <!-- Robot arm with sensor -->
  <rect x="100" y="200" width="200" height="40" class="robot-arm" rx="5" ry="5"/>
  <text x="200" y="225" class="text" text-anchor="middle" style="fill: white;">Robot Arm</text>

  <!-- Force/Torque Sensor -->
  <rect x="280" y="190" width="40" height="60" class="sensor"/>
  <text x="300" y="215" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">6-axis</text>
  <text x="300" y="230" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">F/T</text>
  <text x="300" y="245" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Sensor</text>

  <!-- End effector -->
  <rect x="320" y="195" width="60" height="50" class="robot-arm" rx="5" ry="5"/>
  <text x="350" y="225" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">End</text>
  <text x="350" y="235" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Effector</text>

  <!-- Object being manipulated -->
  <rect x="400" y="200" width="80" height="40" class="object" rx="5" ry="5"/>
  <text x="440" y="225" class="text" text-anchor="middle" style="fill: white;">Object</text>

  <!-- Force in X direction -->
  <line x1="400" y1="220" x2="360" y2="220" class="force-vector"/>
  <text x="380" y="215" class="label">Fx</text>

  <!-- Force in Y direction -->
  <line x1="420" y1="200" x2="420" y2="160" class="force-vector"/>
  <text x="425" y="180" class="label">Fy</text>

  <!-- Force in Z direction -->
  <line x1="440" y1="240" x2="440" y2="280" class="force-vector"/>
  <text x="445" y="260" class="label">Fz</text>

  <!-- Torque around X axis -->
  <path d="M 420 260 A 20 20 0 1 1 460 260" class="torque-arc"/>
  <polygon points="460,260 455,255 455,265" fill="#f39c12" transform="rotate(90, 460, 260)"/>
  <text x="440" y="275" class="label">Tx</text>

  <!-- Torque around Y axis -->
  <path d="M 460 220 A 20 20 0 1 0 460 180" class="torque-arc"/>
  <polygon points="460,180 455,185 465,185" fill="#f39c12" transform="rotate(0, 460, 180)"/>
  <text x="465" y="200" class="label">Ty</text>

  <!-- Torque around Z axis -->
  <path d="M 380 240 A 25 25 0 1 1 380 200" class="torque-arc"/>
  <polygon points="380,200 375,205 385,205" fill="#f39c12" transform="rotate(0, 380, 200)"/>
  <text x="360" y="225" class="label">Tz</text>

  <!-- Internal sensor components -->
  <text x="150" y="300" class="subtitle">Internal Strain Gauge Configuration:</text>

  <!-- Strain gauge representation -->
  <rect x="120" y="320" width="100" height="60" style="fill: #ecf0f1; stroke: #7f8c8d; stroke-width: 1;"/>
  <circle cx="140" cy="340" r="3" style="fill: #e74c3c;"/>
  <circle cx="160" cy="340" r="3" style="fill: #e74c3c;"/>
  <circle cx="180" cy="340" r="3" style="fill: #e74c3c;"/>
  <circle cx="140" cy="360" r="3" style="fill: #e74c3c;"/>
  <circle cx="160" cy="360" r="3" style="fill: #e74c3c;"/>
  <circle cx="180" cy="360" r="3" style="fill: #e74c3c;"/>
  <text x="170" y="335" class="text" style="font-size: 8px;">Fx, Fy</text>
  <text x="170" y="355" class="text" style="font-size: 8px;">Fz, Tx</text>
  <text x="150" y="375" class="text" style="font-size: 8px;">Ty, Tz</text>

  <!-- Force/Torque data representation -->
  <rect x="650" y="100" width="180" height="120" style="fill: #ecf0f1; stroke: #34495e; stroke-width: 2;"/>
  <text x="740" y="120" class="text" text-anchor="middle" style="font-weight: bold;">Force/Torque Output</text>
  <text x="740" y="140" class="text" text-anchor="middle">F = [Fx, Fy, Fz]</text>
  <text x="740" y="155" class="text" text-anchor="middle">T = [Tx, Ty, Tz]</text>
  <text x="740" y="170" class="text" text-anchor="middle" style="font-style: italic;">(6-axis measurements)</text>
  <text x="740" y="190" class="text" text-anchor="middle" style="font-size: 10px;">Units: Newtons, Newton-meters</text>

  <!-- Applications -->
  <rect x="650" y="240" width="180" height="100" style="fill: #f1c40f; stroke: #f39c12; stroke-width: 2; rx: 10; ry: 10;"/>
  <text x="740" y="260" class="text" text-anchor="middle" style="font-weight: bold; fill: #2c3e50;">Applications</text>
  <text x="740" y="280" class="text" text-anchor="middle" style="fill: #2c3e50; font-size: 12px;">Assembly</text>
  <text x="740" y="295" class="text" text-anchor="middle" style="fill: #2c3e50; font-size: 12px;">Grasping</text>
  <text x="740" y="310" class="text" text-anchor="middle" style="fill: #2c3e50; font-size: 12px;">Surface Following</text>
  <text x="740" y="325" class="text" text-anchor="middle" style="fill: #2c3e50; font-size: 12px;">Compliance Control</text>

  <!-- Sensor types -->
  <rect x="650" y="360" width="85" height="80" style="fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; rx: 5; ry: 5;"/>
  <text x="692" y="380" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Strain</text>
  <text x="692" y="395" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Gauge</text>
  <text x="692" y="410" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Type</text>

  <rect x="755" y="360" width="85" height="80" style="fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 5; ry: 5;"/>
  <text x="797" y="380" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Optical</text>
  <text x="797" y="395" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Type</text>
  <text x="797" y="410" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">(Lever)</text>

  <!-- Labels -->
  <text x="450" y="470" class="subtitle" text-anchor="middle">Force/Torque sensors measure 6-axis forces and torques</text>
  <text x="450" y="490" class="subtitle" text-anchor="middle">Essential for precise manipulation and contact-based tasks</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
</svg>