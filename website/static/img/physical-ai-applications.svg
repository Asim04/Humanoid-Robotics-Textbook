<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .subtitle { font: 16px sans-serif; fill: #34495e; }
    .application { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 10; ry: 10; }
    .app-text { font: 14px sans-serif; fill: white; text-anchor: middle; }
    .icon { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
    .connection { stroke: #bdc3c7; stroke-width: 1; }
  </style>

  <text x="450" y="30" class="title">Applications of Physical AI</text>

  <!-- Manufacturing -->
  <rect x="50" y="80" width="180" height="120" class="application"/>
  <text x="140" y="110" class="app-text">Manufacturing</text>
  <text x="140" y="135" class="app-text">Assembly Robots</text>
  <text x="140" y="155" class="app-text">Quality Inspection</text>
  <text x="140" y="175" class="app-text">Adaptive Processes</text>

  <!-- Healthcare -->
  <rect x="250" y="80" width="180" height="120" class="application"/>
  <text x="340" y="110" class="app-text">Healthcare</text>
  <text x="340" y="135" class="app-text">Surgical Robots</text>
  <text x="340" y="155" class="app-text">Rehabilitation</text>
  <text x="340" y="175" class="app-text">Assistive Devices</text>

  <!-- Service Robotics -->
  <rect x="450" y="80" width="180" height="120" class="application"/>
  <text x="540" y="110" class="app-text">Service Robotics</text>
  <text x="540" y="135" class="app-text">Domestic Robots</text>
  <text x="540" y="155" class="app-text">Customer Service</text>
  <text x="540" y="175" class="app-text">Delivery Robots</text>

  <!-- Autonomous Vehicles -->
  <rect x="650" y="80" width="180" height="120" class="application"/>
  <text x="740" y="110" class="app-text">Autonomous Vehicles</text>
  <text x="740" y="135" class="app-text">Self-driving Cars</text>
  <text x="740" y="155" class="app-text">Drones & UAVs</text>
  <text x="740" y="175" class="app-text">Underwater Vehicles</text>

  <!-- Humanoid Robot in center -->
  <circle cx="450" y="350" r="60" class="icon"/>
  <text x="450" y="355" class="subtitle" style="fill: #2c3e50; font-weight: bold;">Humanoid</text>
  <text x="450" y="375" class="subtitle" style="fill: #2c3e50;">Robot</text>

  <!-- Arrows from applications to central robot -->
  <line x1="140" y1="200" x2="420" y2="290" class="connection" stroke-dasharray="5,5"/>
  <line x1="340" y1="200" x2="435" y2="290" class="connection" stroke-dasharray="5,5"/>
  <line x1="540" y1="200" x2="465" y2="290" class="connection" stroke-dasharray="5,5"/>
  <line x1="740" y1="200" x2="480" y2="290" class="connection" stroke-dasharray="5,5"/>

  <!-- Challenges around the robot -->
  <rect x="250" y="420" width="140" height="60" style="fill: #e74c3c; stroke: #c0392b; stroke-width: 2; rx: 10; ry: 10;"/>
  <text x="320" y="445" class="app-text" style="fill: white;">Challenges</text>
  <text x="320" y="465" class="app-text" style="fill: white;">Real-time, Safety</text>

  <rect x="510" y="420" width="140" height="60" style="fill: #f39c12; stroke: #d35400; stroke-width: 2; rx: 10; ry: 10;"/>
  <text x="580" y="445" class="app-text" style="fill: white;">Opportunities</text>
  <text x="580" y="465" class="app-text" style="fill: white;">Innovation, Impact</text>

  <!-- Title for central concept -->
  <text x="450" y="250" class="subtitle">Physical AI Integration</text>
  <text x="450" y="270" class="subtitle">Embodied Intelligence in Action</text>
</svg>