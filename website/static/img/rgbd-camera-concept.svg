<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .subtitle { font: 16px sans-serif; fill: #34495e; }
    .camera { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 5; ry: 5; }
    .cone { fill: #ecf0f1; stroke: #7f8c8d; stroke-width: 1; stroke-dasharray: 4,2; }
    .rgb-image { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
    .depth-image { fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; }
    .object { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
    .text { font: 14px sans-serif; fill: #2c3e50; }
    .label { font: 14px sans-serif; fill: #e74c3c; font-weight: bold; }
  </style>

  <text x="450" y="30" class="title">RGB-D Camera (e.g., RealSense) Concept</text>

  <!-- RGB-D Camera -->
  <rect x="100" y="200" width="80" height="40" class="camera"/>
  <circle cx="170" cy="220" r="8" style="fill: #2c3e50;"/> <!-- Lens -->
  <text x="140" y="215" class="text">RGB</text>
  <text x="140" y="235" class="text">Depth</text>

  <!-- Field of view cone -->
  <path d="M 180 220 L 350 120 L 350 320 Z" class="cone" style="fill-opacity: 0.2;"/>

  <!-- Scene objects -->
  <rect x="380" y="200" width="80" height="80" class="object"/> <!-- Cube -->
  <circle cx="520" cy="240" r="40" class="object"/> <!-- Sphere -->

  <!-- RGB Image representation -->
  <rect x="650" y="100" width="120" height="90" class="rgb-image"/>
  <text x="710" y="120" class="text" text-anchor="middle" style="fill: white;">RGB Image</text>
  <!-- Simulated RGB content -->
  <rect x="660" y="130" width="35" height="35" style="fill: #e74c3c;"/> <!-- Red cube -->
  <circle cx="710" cy="150" r="15" style="fill: #3498db;"/> <!-- Blue sphere -->
  <text x="680" y="185" class="text" style="font-size: 10px;">Color &amp; Texture</text>

  <!-- Depth Image representation -->
  <rect x="650" y="220" width="120" height="90" class="depth-image"/>
  <text x="710" y="240" class="text" text-anchor="middle" style="fill: white;">Depth Image</text>
  <!-- Simulated depth content -->
  <rect x="660" y="250" width="35" height="35" style="fill: #2ecc71;"/> <!-- Close = Green -->
  <circle cx="710" cy="270" r="15" style="fill: #f39c12;"/> <!-- Farther = Orange -->
  <text x="680" y="305" class="text" style="font-size: 10px;">Distance (m)</text>

  <!-- Arrows showing data flow -->
  <line x1="180" y1="220" x2="650" y2="145" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="220" x2="650" y2="265" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Connection between RGB and Depth -->
  <line x1="710" y="190" x2="710" y="220" stroke="#f1c40f" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Labels -->
  <text x="250" y="80" class="subtitle">Field of View</text>
  <text x="450" y="350" class="subtitle">RGB-D cameras provide both color (RGB) and depth information</text>
  <text x="450" y="370" class="subtitle">Essential for 3D reconstruction and object recognition</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d" />
    </marker>
  </defs>
</svg>