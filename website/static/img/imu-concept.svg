<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .subtitle { font: 16px sans-serif; fill: #34495e; }
    .imu { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 5; ry: 5; }
    .accelerometer { fill: #2ecc71; stroke: #27ae60; stroke-width: 1; }
    .gyroscope { fill: #9b59b6; stroke: #8e44ad; stroke-width: 1; }
    .axis { stroke: #e74c3c; stroke-width: 2; stroke-dasharray: 4,2; }
    .vector { stroke: #f39c12; stroke-width: 3; marker-end: url(#arrowhead); }
    .text { font: 14px sans-serif; fill: #2c3e50; }
    .label { font: 14px sans-serif; fill: #e74c3c; font-weight: bold; }
    .robot { fill: #ecf0f1; stroke: #7f8c8d; stroke-width: 2; }
  </style>

  <text x="450" y="30" class="title">IMU (Inertial Measurement Unit) Concept</text>

  <!-- Robot with IMU -->
  <rect x="150" y="150" width="200" height="200" class="robot" rx="10" ry="10"/>
  <text x="250" y="170" class="text" text-anchor="middle">Robot Body</text>

  <!-- IMU sensor inside robot -->
  <rect x="220" y="220" width="60" height="60" class="imu"/>
  <text x="250" y="240" class="text" text-anchor="middle" style="fill: white;">IMU</text>
  <text x="250" y="255" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">3-axis</text>
  <text x="250" y="270" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">Sensor</text>

  <!-- Coordinate system -->
  <line x1="250" y1="220" x2="250" y2="180" class="axis"/>
  <line x1="250" y1="220" x2="290" y2="220" class="axis"/>
  <line x1="250" y1="220" x2="235" y2="205" class="axis"/>
  <text x="255" y="185" class="text">Z</text>
  <text x="295" y="225" class="text">X</text>
  <text x="225" y="200" class="text">Y</text>

  <!-- Acceleration vector -->
  <line x1="250" y1="250" x2="350" y2="250" class="vector"/>
  <text x="300" y="245" class="label">Linear</text>
  <text x="300" y="260" class="label">Acceleration</text>

  <!-- Angular velocity vector -->
  <path d="M 220 280 A 30 30 0 1 1 280 280" class="vector" fill="none"/>
  <polygon points="280,280 275,275 275,285" fill="#f39c12" transform="rotate(45, 280, 280)"/>
  <text x="250" y="320" class="label" text-anchor="middle">Angular</text>
  <text x="250" y="335" class="label" text-anchor="middle">Velocity</text>

  <!-- Accelerometer component -->
  <rect x="500" y="100" width="120" height="80" class="accelerometer"/>
  <text x="560" y="120" class="text" text-anchor="middle" style="fill: white;">Accelerometer</text>
  <text x="560" y="140" class="text" text-anchor="middle" style="fill: white; font-size: 12px;">Measures</text>
  <text x="560" y="155" class="text" text-anchor="middle" style="fill: white; font-size: 12px;">Linear Accel</text>
  <text x="560" y="170" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">a = [ax, ay, az]</text>

  <!-- Gyroscope component -->
  <rect x="650" y="100" width="120" height="80" class="gyroscope"/>
  <text x="710" y="120" class="text" text-anchor="middle" style="fill: white;">Gyroscope</text>
  <text x="710" y="140" class="text" text-anchor="middle" style="fill: white; font-size: 12px;">Measures</text>
  <text x="710" y="155" class="text" text-anchor="middle" style="fill: white; font-size: 12px;">Angular Vel</text>
  <text x="710" y="170" class="text" text-anchor="middle" style="fill: white; font-size: 10px;">ω = [ωx, ωy, ωz]</text>

  <!-- Magnetometer component -->
  <rect x="575" y="200" width="120" height="80" class="imu"/>
  <text x="635" y="220" class="text" text-anchor="middle" style="fill: white;">Magnetometer</text>
  <text x="635" y="240" class="text" text-anchor="middle" style="fill: white; font-size: 12px;">Measures</text>
  <text x="635" y="255" class="text" text-anchor="middle" style="fill: white; font-size: 12px;">Magnetic Field</text>

  <!-- IMU Data Output -->
  <rect x="575" y="300" width="150" height="100" style="fill: #ecf0f1; stroke: #34495e; stroke-width: 2;"/>
  <text x="650" y="320" class="text" text-anchor="middle" style="font-weight: bold;">IMU Output Data</text>
  <text x="650" y="340" class="text" text-anchor="middle">a = [ax, ay, az]</text>
  <text x="650" y="355" class="text" text-anchor="middle">ω = [ωx, ωy, ωz]</text>
  <text x="650" y="370" class="text" text-anchor="middle">m = [mx, my, mz]</text>
  <text x="650" y="385" class="text" text-anchor="middle" style="font-style: italic;">(3-axis measurements)</text>

  <!-- Proprioception concept -->
  <rect x="100" y="380" width="250" height="80" style="fill: #f1c40f; stroke: #f39c12; stroke-width: 2; rx: 10; ry: 10;"/>
  <text x="225" y="405" class="text" text-anchor="middle" style="fill: #2c3e50; font-weight: bold;">Proprioception</text>
  <text x="225" y="425" class="text" text-anchor="middle" style="fill: #2c3e50; font-size: 12px;">Body awareness through</text>
  <text x="225" y="440" class="text" text-anchor="middle" style="fill: #2c3e50; font-size: 12px;">internal sensor feedback</text>

  <!-- Labels -->
  <text x="450" y="470" class="subtitle" text-anchor="middle">IMUs provide 3-axis acceleration, rotation, and magnetic field measurements</text>
  <text x="450" y="490" class="subtitle" text-anchor="middle">Essential for navigation, stabilization, and proprioception in robots</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12" />
    </marker>
  </defs>
</svg>