<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .subtitle { font: 16px sans-serif; fill: #34495e; }
    .box { fill: #ecf0f1; stroke: #3498db; stroke-width: 2; rx: 10; ry: 10; }
    .arrow { stroke: #e74c3c; stroke-width: 3; marker-end: url(#arrowhead); }
    .text { font: 14px sans-serif; fill: #2c3e50; text-anchor: middle; }
    .legend { font: 14px sans-serif; fill: #7f8c8d; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>

  <text x="400" y="30" class="title">Digital AI vs Physical AI</text>

  <!-- Digital AI Box -->
  <rect x="50" y="80" width="300" height="280" class="box"/>
  <text x="200" y="110" class="subtitle">Digital AI</text>

  <text x="200" y="150" class="text">Discrete inputs/outputs</text>
  <text x="200" y="180" class="text">Simulated environments</text>
  <text x="200" y="210" class="text">No physical constraints</text>
  <text x="200" y="240" class="text">Deterministic behavior</text>
  <text x="200" y="270" class="text">No safety concerns</text>

  <!-- Physical AI Box -->
  <rect x="450" y="80" width="300" height="280" class="box"/>
  <text x="600" y="110" class="subtitle">Physical AI</text>

  <text x="600" y="150" class="text">Continuous sensor data</text>
  <text x="600" y="180" class="text">Real-world environments</text>
  <text x="600" y="210" class="text">Physics-based constraints</text>
  <text x="600" y="240" class="text">Probabilistic behavior</text>
  <text x="600" y="270" class="text">Critical safety requirements</text>

  <!-- Arrow between boxes -->
  <line x1="350" y1="220" x2="450" y2="220" class="arrow"/>

  <text x="400" y="210" class="legend">Evolution</text>
</svg>