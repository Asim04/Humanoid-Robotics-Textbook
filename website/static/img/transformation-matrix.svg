<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style>
    .title { font: bold 20px sans-serif; fill: #2c3e50; }
    .subtitle { font: 16px sans-serif; fill: #34495e; }
    .matrix { fill: #ecf0f1; stroke: #3498db; stroke-width: 2; }
    .matrix-element { font: 16px sans-serif; fill: #2c3e50; text-anchor: middle; }
    .equation { font: 18px sans-serif; fill: #2c3e50; }
    .label { font: 16px sans-serif; fill: #e74c3c; }
    .vector { fill: #e8f6f3; stroke: #1abc9c; stroke-width: 2; }
  </style>

  <text x="400" y="30" class="title">Transformation Matrix in Physical AI</text>

  <!-- T = [R p; 0 1] equation -->
  <text x="400" y="70" class="equation">T =</text>

  <!-- Transformation Matrix T -->
  <rect x="320" y="90" width="160" height="160" class="matrix"/>

  <!-- Matrix elements -->
  <text x="360" y="130" class="matrix-element">R</text>
  <text x="360" y="170" class="matrix-element">0</text>
  <text x="440" y="130" class="matrix-element">p</text>
  <text x="440" y="170" class="matrix-element">1</text>

  <!-- Labels -->
  <text x="360" y="270" class="label">Rotation Matrix (R)</text>
  <text x="440" y="270" class="label">Position Vector (p)</text>

  <!-- Example: Point transformation -->
  <text x="150" y="120" class="equation">Point:</text>
  <rect x="220" y="95" width="60" height="60" class="vector"/>
  <text x="250" y="125" class="matrix-element">x</text>
  <text x="250" y="145" class="matrix-element">y</text>
  <text x="250" y="165" class="matrix-element">1</text>

  <text x="290" y="130" class="equation">→</text>

  <text x="500" y="120" class="equation">Transformed:</text>
  <rect x="600" y="95" width="60" height="60" class="vector"/>
  <text x="630" y="125" class="matrix-element">x'</text>
  <text x="630" y="145" class="matrix-element">y'</text>
  <text x="630" y="165" class="matrix-element">1</text>

  <!-- Arrow showing transformation -->
  <line x1="280" y1="125" x2="600" y2="125" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Explanation -->
  <text x="400" y="320" class="subtitle">T = Transformation Matrix</text>
  <text x="400" y="345" class="subtitle">R = Rotation (3x3 matrix), p = Position vector (3x1)</text>
  <text x="400" y="370" class="subtitle">Used for spatial relationships in robotics and embodied systems</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
</svg>